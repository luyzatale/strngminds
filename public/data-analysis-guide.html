function handleQuizAnswer(btn){
  const qid = btn.dataset.qid, oi = +btn.dataset.oi, correct = +btn.dataset.correct;
  if(state.quizAnswers[qid]!==undefined) return;
  state.quizAnswers[qid] = oi;
  persist('daig_quiz', state.quizAnswers);
  const group = btn.closest('.quiz-options');
  if(!group) return;
  Array.prototype.forEach.call(group.querySelectorAll('.quiz-option'), function(b, idx){
    b.disabled = true;
    if(idx===correct) b.classList.add('correct');
    else if(idx===oi) b.classList.add('incorrect');
  });
  const explain = group.nextElementSibling;
  if(explain) explain.classList.add('show');
}
function jumpToConcept(id){
  const el = document.getElementById('card-'+id);
  if(!el) return;
  el.open = true;
  state.openCards.add(id);
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.style.transition = 'box-shadow .3s';
  el.style.boxShadow = '0 0 0 2px var(--accent-cyan)';
  setTimeout(function(){ el.style.boxShadow=''; }, 1600);
}

/* ==========================================================================
   ACTIONS
   ========================================================================== */
function handleAction(action, target){
  switch(action){
    case 'toggle-bookmark': toggleBookmark(target.dataset.id); break;
    case 'toggle-favorite': toggleFavorite(target.dataset.id); break;
    case 'jump-related': { const found = findConceptByTitle(target.dataset.title); if(found) jumpToConcept(found.id); break; }
    case 'quiz-answer': handleQuizAnswer(target); break;
    case 'expand-all': Array.prototype.forEach.call(document.querySelectorAll('#content-root details'), function(d){ d.open=true; }); break;
    case 'collapse-all': Array.prototype.forEach.call(document.querySelectorAll('#content-root details'), function(d){ d.open=false; }); break;
    case 'expand-level': Array.prototype.forEach.call(document.querySelectorAll('#level-'+target.dataset.level+' details'), function(d){ d.open=true; }); break;
    case 'collapse-level': Array.prototype.forEach.call(document.querySelectorAll('#level-'+target.dataset.level+' details'), function(d){ d.open=false; }); break;
    case 'fc-flip': {
      state.fcFlipped = !state.fcFlipped;
      const card = document.querySelector('.fc-card');
      if(card) card.classList.toggle('flipped', state.fcFlipped);
      break;
    }
    case 'fc-next': fcMove(1); break;
    case 'fc-prev': fcMove(-1); break;
    case 'fc-shuffle': shuffleArray(state.fcDeckIds); state.fcIndex=0; state.fcFlipped=false; patchFcSection(); break;
    case 'fc-bookmarked': state.fcBookmarkedOnly = !state.fcBookmarkedOnly; resetFcDeck(); patchFcSection(); break;
    case 'kg-jump': jumpToConcept(target.dataset.id); break;
    case 'search-jump': {
      const type = target.dataset.type, id = target.dataset.id;
      const sr = document.getElementById('search-results'); if(sr) sr.classList.remove('open');
      const si = document.getElementById('search-input'); if(si) si.value='';
      if(type==='concept') jumpToConcept(id);
      else { const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth'}); }
      break;
    }
  }
}

   SEARCH
   ========================================================================== */
function buildSearchResults(query){
  query = query.trim().toLowerCase();
  if(!query) return [];
  const results = [];
  ALL_CONCEPTS.forEach(function(c){
    const L = c[state.lang];
    if(L.title.toLowerCase().indexOf(query)!==-1 || L.definition.toLowerCase().indexOf(query)!==-1){
      const lm = LEVELS_META.find(function(l){return l.n===c.level;});
      results.push({type:'concept', id:c.id, title:L.title, meta: lm?lm[state.lang]:''});
    }
  });
  const iq = typeof INTERVIEW_QUESTIONS!=='undefined' ? INTERVIEW_QUESTIONS : [];
  iq.forEach(function(q){
    const L = q[state.lang];
    if(L.question.toLowerCase().indexOf(query)!==-1){
      results.push({type:'interview', id:'interview', title:L.question, meta:t('sectionInterviewTitle')});
    }
  });
  return results.slice(0,12);
}
function renderSearchResults(results, query){
  const box = document.getElementById('search-results');
  if(!box) return;
  if(!query.trim()){ box.classList.remove('open'); box.innerHTML=''; return; }
  if(!results.length){ box.innerHTML = '<div class="sr-empty">'+t('emptySearch')+'</div>'; box.classList.add('open'); return; }
  box.innerHTML = results.map(function(r){
    return '<button class="sr-item" data-action="search-jump" data-type="'+r.type+'" data-id="'+r.id+'"><div class="sr-title">'+esc(r.title)+'</div><div class="sr-meta">'+esc(r.meta||'')+'</div></button>';
  }).join('');
  box.classList.add('open');
}
function filterGlossary(q){
  q = q.trim().toLowerCase();
  Array.prototype.forEach.call(document.querySelectorAll('#glossary-list .glossary-item'), function(item){
    const text = item.textContent.toLowerCase();
    item.style.display = (!q || text.indexOf(q)!==-1) ? '' : 'none';
  });
}

/* ==========================================================================
   CONTRAST / LANGUAGE / MODALS
   ========================================================================== */
function toggleContrast(){
  const html = document.documentElement;
  const next = html.dataset.contrast==='high' ? 'normal' : 'high';
  html.dataset.contrast = next;
  localStorage.setItem('daig_contrast', next);
  state.contrast = next;
  const btn = document.getElementById('btn-contrast');
  if(btn){ btn.classList.toggle('active', next==='high'); btn.setAttribute('aria-pressed', String(next==='high')); }
}
function setLang(lang){
  state.lang = lang;
  localStorage.setItem('daig_lang', lang);
  Array.prototype.forEach.call(document.querySelectorAll('.lang-switch button'), function(b){ b.classList.toggle('active', b.dataset.lang===lang); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function(el){ el.textContent = t(el.dataset.i18n); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-placeholder]'), function(el){ el.placeholder = t(el.dataset.i18nPlaceholder); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-title]'), function(el){ el.title = t(el.dataset.i18nTitle); });
  fullRender();
  renderShortcutsModal();
}
const SHORTCUTS = [
  {keys:'/', en:'Focus search', pt:'Focar na busca'},
  {keys:'E', en:'Expand all cards', pt:'Expandir todos os cards'},
  {keys:'C', en:'Collapse all cards', pt:'Recolher todos os cards'},
  {keys:'T', en:'Toggle high contrast', pt:'Alternar alto contraste'},
  {keys:'B', en:'Back to top', pt:'Voltar ao topo'},
  {keys:'← / →', en:'Navigate flashcards', pt:'Navegar flashcards'},
  {keys:'?', en:'Show this dialog', pt:'Mostrar esta janela'},
  {keys:'Esc', en:'Close dialogs', pt:'Fechar janelas'}
];
function renderShortcutsModal(){
  const el = document.getElementById('shortcuts-list');
  if(!el) return;
  el.innerHTML = SHORTCUTS.map(function(s){ return '<div class="shortcut-row"><span>'+s[state.lang]+'</span><kbd>'+s.keys+'</kbd></div>'; }).join('');
}
function openShortcutsModal(){ renderShortcutsModal(); const m=document.getElementById('shortcuts-modal'); if(m) m.classList.add('open'); }
function closeAllModals(){ Array.prototype.forEach.call(document.querySelectorAll('.modal-backdrop'), function(m){ m.classList.remove('open'); }); }

/* ==========================================================================
   PROGRESS BAR
   ========================================================================== */
function updateProgressBar(){
  const doc = document.documentElement;
  const scrollTop = window.scrollY;
  const height = doc.scrollHeight - doc.clientHeight;
  const pct = height>0 ? (scrollTop/height*100) : 0;
  const bar = document.getElementById('progress-bar');
  if(bar) bar.style.width = pct+'%';
  const btt = document.getElementById('back-to-top');
  if(btt) btt.style.display = scrollTop>600 ? 'flex' : 'none';
}

/* ==========================================================================
   EVENT WIRING
   ========================================================================== */
function initEventListeners(){
  document.addEventListener('click', function(e){
    const scrollBtn = e.target.closest('[data-scrollto]');
    if(scrollBtn){
      const tgt = scrollBtn.dataset.scrollto;
      if(tgt==='top') window.scrollTo({top:0, behavior:'smooth'});
      else { const el=document.getElementById(tgt); if(el) el.scrollIntoView({behavior:'smooth'}); }
    }
    const actionEl = e.target.closest('[data-action]');
    if(actionEl){
      const action = actionEl.dataset.action;
      if(action==='toggle-bookmark' || action==='toggle-favorite') e.preventDefault();
      handleAction(action, actionEl);
    }
    if(!e.target.closest('.header-search')){
      const sr = document.getElementById('search-results');
      if(sr) sr.classList.remove('open');
    }
  });

  document.addEventListener('toggle', function(e){
    const d = e.target;
    if(d.tagName==='DETAILS' && d.dataset && d.dataset.id){
      if(d.open){
        state.read.add(d.dataset.id);
        state.openCards.add(d.dataset.id);
        persist('daig_read', Array.from(state.read));
        renderSidebar();
        const rm = document.getElementById('roadmap');
        if(rm) rm.outerHTML = renderRoadmap();
      } else {
        state.openCards.delete(d.dataset.id);
      }
    }
  }, true);

  document.addEventListener('input', debounce(function(e){
    if(e.target.id==='search-input'){ renderSearchResults(buildSearchResults(e.target.value), e.target.value); }
    if(e.target.id==='glossary-filter'){ filterGlossary(e.target.value); }
    if(e.target.matches && e.target.matches('textarea[data-reflect-key]')){
      const key = e.target.dataset.reflectKey;
      state.reflections[key] = e.target.value;
      persist('daig_reflect', state.reflections);
      const savedEl = document.getElementById('rb-saved-'+key);
      if(savedEl){ savedEl.classList.add('show'); setTimeout(function(){ savedEl.classList.remove('show'); }, 1500); }
    }
  }, 200));

  document.addEventListener('change', function(e){
    if(e.target.id==='fc-level-filter'){
      state.fcLevelFilter = e.target.value;
      resetFcDeck();
      patchFcSection();
    }
    if(e.target.id==='kg-level-select'){
      const wrap = document.getElementById('kg-svg-wrap');
      if(wrap) wrap.innerHTML = renderKGSvg(+e.target.value);
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll('.lang-switch button'), function(b){
    b.addEventListener('click', function(){ setLang(b.dataset.lang); });
  });
  const contrastBtn = document.getElementById('btn-contrast');
  if(contrastBtn) contrastBtn.addEventListener('click', toggleContrast);

  const printBtn = document.getElementById('btn-print');
  if(printBtn) printBtn.addEventListener('click', function(){
    const closedDetails = Array.prototype.filter.call(document.querySelectorAll('#content-root details'), function(d){return !d.open;});
    closedDetails.forEach(function(d){ d.open = true; });
    window.print();
    setTimeout(function(){ closedDetails.forEach(function(d){ d.open = false; }); }, 500);
  });

  const shortcutsBtn = document.getElementById('btn-shortcuts');
  if(shortcutsBtn) shortcutsBtn.addEventListener('click', openShortcutsModal);
  const footerShortcuts = document.getElementById('footer-shortcuts');
  if(footerShortcuts) footerShortcuts.addEventListener('click', openShortcutsModal);
  Array.prototype.forEach.call(document.querySelectorAll('[data-close-modal]'), function(b){ b.addEventListener('click', closeAllModals); });
  const shortcutsModal = document.getElementById('shortcuts-modal');
  if(shortcutsModal) shortcutsModal.addEventListener('click', function(e){ if(e.target===this) closeAllModals(); });

  const hamburger = document.getElementById('hamburger-btn');
  if(hamburger) hamburger.addEventListener('click', function(){
    const sb = document.getElementById('sidebar'), bd = document.getElementById('sidebar-backdrop');
    const open = !sb.classList.contains('open');
    sb.classList.toggle('open', open); bd.classList.toggle('open', open);
    hamburger.setAttribute('aria-expanded', String(open));
  });
  const backdrop = document.getElementById('sidebar-backdrop');
  if(backdrop) backdrop.addEventListener('click', function(){
    document.getElementById('sidebar').classList.remove('open');
    backdrop.classList.remove('open');
  });
  document.addEventListener('click', function(e){
    if(window.innerWidth<=960 && e.target.closest('#sidebar a')){
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-backdrop').classList.remove('open');
    }
  });

  const backToTop = document.getElementById('back-to-top');
  if(backToTop) backToTop.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });

  window.addEventListener('scroll', throttle(updateProgressBar, 60), {passive:true});

  document.addEventListener('keydown', function(e){
    const tag = (e.target.tagName||'').toLowerCase();
    const typing = tag==='input' || tag==='textarea';
    if(e.key==='Escape'){
      closeAllModals();
      const sr=document.getElementById('search-results'); if(sr) sr.classList.remove('open');
      const sb=document.getElementById('sidebar'); if(sb) sb.classList.remove('open');
      const bd=document.getElementById('sidebar-backdrop'); if(bd) bd.classList.remove('open');
      return;
    }
    if(typing) return;
    if(e.key==='/'){ e.preventDefault(); const si=document.getElementById('search-input'); if(si) si.focus(); return; }
    if(e.key==='?'){ openShortcutsModal(); return; }
    const k = e.key.toLowerCase();
    if(k==='e'){ Array.prototype.forEach.call(document.querySelectorAll('#content-root details'), function(d){ d.open=true; }); return; }
    if(k==='c'){ Array.prototype.forEach.call(document.querySelectorAll('#content-root details'), function(d){ d.open=false; }); return; }
    if(k==='t'){ toggleContrast(); return; }
    if(k==='b'){ window.scrollTo({top:0, behavior:'smooth'}); return; }
    if(e.key==='ArrowRight' && isInViewport(document.getElementById('flashcards'))){ handleAction('fc-next'); return; }
    if(e.key==='ArrowLeft' && isInViewport(document.getElementById('flashcards'))){ handleAction('fc-prev'); return; }
  });
}

/* ==========================================================================
   INIT
   ========================================================================== */
function init(){
  const levelArrays = [
    (typeof CONCEPTS_L1!=='undefined'?CONCEPTS_L1:[]),
    (typeof CONCEPTS_L2!=='undefined'?CONCEPTS_L2:[]),
    (typeof CONCEPTS_L3!=='undefined'?CONCEPTS_L3:[]),
    (typeof CONCEPTS_L4!=='undefined'?CONCEPTS_L4:[]),
    (typeof CONCEPTS_L5!=='undefined'?CONCEPTS_L5:[]),
    (typeof CONCEPTS_L6!=='undefined'?CONCEPTS_L6:[]),
    (typeof CONCEPTS_L7!=='undefined'?CONCEPTS_L7:[]),
    (typeof CONCEPTS_L8!=='undefined'?CONCEPTS_L8:[]),
    (typeof CONCEPTS_L9!=='undefined'?CONCEPTS_L9:[]),
    (typeof CONCEPTS_L10!=='undefined'?CONCEPTS_L10:[]),
    (typeof CONCEPTS_L11!=='undefined'?CONCEPTS_L11:[]),
    (typeof CONCEPTS_L12!=='undefined'?CONCEPTS_L12:[]),
    (typeof CONCEPTS_L13!=='undefined'?CONCEPTS_L13:[]),
    (typeof CONCEPTS_L14!=='undefined'?CONCEPTS_L14:[]),
    (typeof CONCEPTS_L15!=='undefined'?CONCEPTS_L15:[])
  ];
  levelArrays.forEach(function(arr, i){
    arr.forEach(function(c){
      c.level = i+1;
      ALL_CONCEPTS.push(c);
      (CONCEPTS_BY_LEVEL[c.level] = CONCEPTS_BY_LEVEL[c.level] || []).push(c);
      CONCEPT_BY_ID[c.id] = c;
    });
  });

  document.documentElement.dataset.contrast = state.contrast;
  const contrastBtn = document.getElementById('btn-contrast');
  if(contrastBtn) contrastBtn.classList.toggle('active', state.contrast==='high');
  Array.prototype.forEach.call(document.querySelectorAll('.lang-switch button'), function(b){ b.classList.toggle('active', b.dataset.lang===state.lang); });

  resetFcDeck();
  fullRender({resetScroll:true});
  updateProgressBar();
  renderShortcutsModal();
  initEventListeners();
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>
