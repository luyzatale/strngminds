<!DOCTYPE html>
<html lang="en" data-contrast="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analysis — The Complete Interactive Guide</title>
<meta name="description" content="A bilingual (EN/PT-BR), offline, single-file interactive textbook covering every core Data Analysis concept from foundations to professional mindset.">
<style>
/* ==========================================================================
   1. RESET & BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}
body { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
h1,h2,h3,h4,h5,h6,p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
table { border-collapse: collapse; width: 100%; }

/* ==========================================================================
   2. DESIGN TOKENS
   ========================================================================== */
:root {
  --bg: #060810;
  --bg-elev-1: #0a0d18;
  --bg-elev-2: #0f1322;
  --bg-elev-3: #151a2c;
  --card-bg: rgba(255,255,255,0.035);
  --card-bg-hover: rgba(255,255,255,0.055);
  --card-border: rgba(255,255,255,0.09);
  --card-border-strong: rgba(255,255,255,0.16);
  --text-primary: #edf0fa;
  --text-secondary: #a6adc9;
  --text-muted: #6d7392;
  --accent-blue: #5b93ff;
  --accent-cyan: #38e0ff;
  --accent-purple: #b083ff;
  --accent-grad: linear-gradient(135deg, var(--accent-blue), var(--accent-purple) 60%, var(--accent-cyan));
  --success: #3ddc9b;
  --warning: #ffc857;
  --danger: #ff6b6b;
  --beginner: #38e0ff;
  --intermediate: #5b93ff;
  --advanced: #b083ff;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --shadow-card: 0 10px 34px rgba(0,0,0,0.38);
  --shadow-pop: 0 20px 60px rgba(0,0,0,0.55);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --header-h: 64px;
  --progress-h: 3px;
  --max-w: 1360px;
  --ease: cubic-bezier(.2,.7,.3,1);
}
[data-contrast="high"] {
  --text-secondary: #d3d7ea;
  --text-muted: #a3a8c4;
  --card-border: rgba(255,255,255,0.28);
  --card-border-strong: rgba(255,255,255,0.45);
  --card-bg: rgba(255,255,255,0.07);
}

html, body { background: var(--bg); color: var(--text-primary); }
body {
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ambient background glow */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(650px 420px at 12% -6%, rgba(91,147,255,0.16), transparent 60%),
    radial-gradient(600px 460px at 100% 8%, rgba(176,131,255,0.14), transparent 60%),
    radial-gradient(700px 500px at 50% 100%, rgba(56,224,255,0.08), transparent 60%),
    var(--bg);
}

::selection { background: rgba(91,147,255,0.35); color: #fff; }
:focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 2px; border-radius: 4px; }

/* scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--card-border-strong); border-radius: 8px; }

.visually-hidden { position: absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.skip-link {
  position: fixed; top: -60px; left: 12px; z-index: 300;
  background: var(--accent-cyan); color: #04121a; padding: 10px 16px;
  border-radius: var(--radius-sm); font-weight: 600; transition: top .2s var(--ease);
}
.skip-link:focus { top: 12px; }

/* ==========================================================================
   3. TYPOGRAPHY HELPERS
   ========================================================================== */
.eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent-cyan); }
.grad-text { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.text-secondary { color: var(--text-secondary); }
.text-muted { color: var(--text-muted); }

/* ==========================================================================
   4. PROGRESS BAR + HEADER
   ========================================================================== */
#progress-bar {
  position: fixed; top: 0; left: 0; height: var(--progress-h); width: 0%;
  background: var(--accent-grad); z-index: 250; transition: width .12s linear;
}

header#site-header {
  position: sticky; top: 0; z-index: 200;
  height: var(--header-h);
  display: flex; align-items: center; gap: 14px;
  padding: 0 18px;
  background: rgba(8,10,18,0.78);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border-bottom: 1px solid var(--card-border);
}
.brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-0.01em; font-size:16px; white-space:nowrap; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-grad); display:flex; align-items:center; justify-content:center; box-shadow: 0 4px 16px rgba(91,147,255,.35); flex-shrink:0; }
.brand-mark svg { width:17px; height:17px; }
.brand small { display:block; font-weight:500; font-size: 10.5px; color: var(--text-muted); letter-spacing: 0.02em; }

#hamburger-btn { display: none; padding: 8px; border-radius: var(--radius-sm); }
#hamburger-btn:hover { background: var(--card-bg); }
#hamburger-btn svg { width: 20px; height: 20px; }

.header-search { position: relative; flex: 1; max-width: 420px; margin-left: 6px; }
.header-search input {
  width: 100%; background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 999px; padding: 9px 14px 9px 38px; color: var(--text-primary);
  transition: border-color .15s var(--ease), background .15s var(--ease);
}
.header-search input::placeholder { color: var(--text-muted); }
.header-search input:focus { border-color: var(--accent-blue); background: var(--bg-elev-2); }
.header-search svg.icon-search { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:15px; height:15px; color: var(--text-muted); pointer-events:none; }
.header-search kbd { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--text-muted); border:1px solid var(--card-border); border-radius:5px; padding:1px 6px; font-family: var(--font-mono); }

#search-results {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0;
  background: var(--bg-elev-2); border: 1px solid var(--card-border-strong);
  border-radius: var(--radius-md); box-shadow: var(--shadow-pop);
  max-height: 60vh; overflow-y: auto; display: none; z-index: 260;
}
#search-results.open { display: block; }
#search-results .sr-item { display:block; width:100%; text-align:left; padding:10px 14px; border-bottom:1px solid var(--card-border); }
#search-results .sr-item:last-child { border-bottom:none; }
#search-results .sr-item:hover, #search-results .sr-item:focus-visible { background: var(--card-bg-hover); }
#search-results .sr-item .sr-title { font-weight:600; font-size:14px; }
#search-results .sr-item .sr-meta { font-size:12px; color:var(--text-muted); margin-top:2px; }
#search-results .sr-empty { padding:16px; color:var(--text-muted); font-size:14px; text-align:center; }

.header-actions { display:flex; align-items:center; gap:6px; margin-left:auto; }
.icon-btn {
  width: 36px; height: 36px; display:flex; align-items:center; justify-content:center;
  border-radius: var(--radius-sm); border: 1px solid transparent; position: relative;
  transition: background .15s var(--ease), border-color .15s var(--ease);
}
.icon-btn:hover { background: var(--card-bg); border-color: var(--card-border); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.active { color: var(--accent-cyan); border-color: rgba(56,224,255,0.4); background: rgba(56,224,255,0.08); }
.icon-btn .badge-dot { position:absolute; top:5px; right:5px; width:7px; height:7px; border-radius:50%; background: var(--accent-cyan); }

.lang-switch { display:flex; border:1px solid var(--card-border); border-radius:999px; overflow:hidden; }
.lang-switch button { padding: 7px 12px; font-size: 12.5px; font-weight:700; color: var(--text-muted); }
.lang-switch button.active { background: var(--accent-grad); color: #04121a; }

/* ==========================================================================
   5. LAYOUT
   ========================================================================== */
.shell { display: flex; max-width: var(--max-w); margin: 0 auto; align-items: flex-start; }

#sidebar-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:150; }
#sidebar-backdrop.open { display:block; }

aside#sidebar {
  width: 272px; flex-shrink: 0;
  position: sticky; top: var(--header-h);
  height: calc(100vh - var(--header-h));
  overflow-y: auto; padding: 20px 12px 40px;
  border-right: 1px solid var(--card-border);
  scrollbar-gutter: stable;
}
.side-group { margin-bottom: 4px; }
.side-group-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); padding: 16px 10px 8px; }
.side-link {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align:left;
  padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13.5px; color: var(--text-secondary);
  transition: background .15s var(--ease), color .15s var(--ease);
}
.side-link:hover { background: var(--card-bg); color: var(--text-primary); }
.side-link.active { background: rgba(91,147,255,0.14); color: var(--text-primary); font-weight: 600; }
.side-link.active .side-num { background: var(--accent-grad); color: #04121a; }
.side-num {
  flex-shrink:0; width: 22px; height: 22px; border-radius: 7px; background: var(--bg-elev-3);
  display:flex; align-items:center; justify-content:center; font-size: 10.5px; font-weight: 800; color: var(--text-muted);
}
.side-link .side-icon { flex-shrink:0; width:16px; height:16px; color: var(--text-muted); }
.side-link .side-progress { margin-left:auto; font-size:10.5px; color:var(--text-muted); font-variant-numeric: tabular-nums; }
.side-link .side-check { margin-left:auto; width:14px; height:14px; color: var(--success); flex-shrink:0; }

main#main {
  flex: 1; min-width: 0; padding: 28px 28px 100px;
}

.breadcrumbs { display:flex; align-items:center; gap:6px; font-size:12.5px; color: var(--text-muted); margin-bottom: 18px; flex-wrap:wrap; }
.breadcrumbs .sep { opacity: .5; }
.breadcrumbs .current { color: var(--text-secondary); }

footer#site-footer { border-top:1px solid var(--card-border); padding: 34px 28px 60px; text-align:center; color: var(--text-muted); font-size:13px; }
footer#site-footer .foot-links { display:flex; gap:16px; justify-content:center; margin-top:10px; flex-wrap:wrap; }

@media (max-width: 960px) {
  #hamburger-btn { display:flex; align-items:center; justify-content:center; }
  aside#sidebar {
    position: fixed; top: 0; left: 0; height: 100vh; z-index: 200; width: 300px;
    background: var(--bg-elev-1); transform: translateX(-100%); transition: transform .25s var(--ease);
    padding-top: calc(var(--header-h) + 10px);
    border-right: 1px solid var(--card-border-strong);
  }
  aside#sidebar.open { transform: translateX(0); box-shadow: var(--shadow-pop); }
  .header-search { display: none; }
  main#main { padding: 20px 16px 80px; }
}

/* ==========================================================================
   6. HERO / INTRO
   ========================================================================== */
.hero-panel {
  border: 1px solid var(--card-border); border-radius: var(--radius-lg);
  background: linear-gradient(160deg, rgba(91,147,255,0.10), rgba(176,131,255,0.06) 55%, transparent);
  padding: 40px 34px; margin-bottom: 30px; position: relative; overflow: hidden;
}
.hero-panel h1 { font-size: clamp(28px, 4vw, 42px); line-height: 1.12; letter-spacing: -0.02em; margin: 10px 0 14px; font-weight: 800; }
.hero-panel p.lead { font-size: 16px; color: var(--text-secondary); max-width: 640px; }
.hero-stats { display:flex; flex-wrap:wrap; gap: 26px; margin-top: 26px; }
.hero-stat .num { font-size: 24px; font-weight: 800; }
.hero-stat .lbl { font-size: 12px; color: var(--text-muted); }
.hero-cta { display:flex; gap:12px; margin-top: 26px; flex-wrap: wrap; }

.btn { display:inline-flex; align-items:center; gap:8px; padding: 11px 20px; border-radius: 999px; font-weight: 700; font-size: 14px; transition: transform .15s var(--ease), box-shadow .15s var(--ease); }
.btn svg { width:16px; height:16px; }
.btn-primary { background: var(--accent-grad); color: #04121a; box-shadow: 0 8px 26px rgba(91,147,255,.3); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(91,147,255,.42); }
.btn-ghost { border: 1px solid var(--card-border-strong); color: var(--text-primary); }
.btn-ghost:hover { background: var(--card-bg); }
.btn-sm { padding: 7px 14px; font-size: 12.5px; }

/* ==========================================================================
   7. ROADMAP
   ========================================================================== */
.roadmap-panel { border:1px solid var(--card-border); border-radius: var(--radius-lg); padding: 26px; margin-bottom: 34px; background: var(--card-bg); }
.roadmap-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom: 20px; flex-wrap:wrap; }
.roadmap-ring-wrap { display:flex; align-items:center; gap:12px; }
.roadmap-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; }
.roadmap-node {
  border:1px solid var(--card-border); border-radius: var(--radius-md); padding: 14px; text-align:left;
  background: var(--bg-elev-2); transition: transform .15s var(--ease), border-color .15s var(--ease);
}
.roadmap-node:hover { transform: translateY(-2px); border-color: var(--card-border-strong); }
.roadmap-node .rn-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.roadmap-node .rn-num { font-size:11px; font-weight:800; color: var(--text-muted); }
.roadmap-node .rn-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; line-height:1.3; min-height: 34px; }
.roadmap-bar { height: 5px; border-radius: 4px; background: var(--bg-elev-3); overflow:hidden; }
.roadmap-bar > span { display:block; height:100%; background: var(--accent-grad); border-radius:4px; transition: width .3s var(--ease); }
.roadmap-pct { font-size:10.5px; color: var(--text-muted); margin-top:6px; }

/* ==========================================================================
   8. LEVEL SECTIONS
   ========================================================================== */
.level-section { padding-top: 10px; margin-bottom: 56px; scroll-margin-top: calc(var(--header-h) + 14px); }
.level-head { display:flex; gap: 18px; align-items:flex-start; margin-bottom: 20px; flex-wrap: wrap; justify-content: space-between; }
.level-head-main { display:flex; gap: 16px; align-items:flex-start; }
.level-badge-num {
  flex-shrink:0; width: 52px; height: 52px; border-radius: var(--radius-md); background: var(--accent-grad);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; color:#04121a;
  box-shadow: 0 8px 24px rgba(91,147,255,.25);
}
.level-head h2 { font-size: clamp(21px, 2.6vw, 27px); letter-spacing:-0.01em; margin-bottom:6px; }
.level-head .level-desc { color: var(--text-secondary); font-size:14.5px; max-width: 640px; }
.level-meta-row { display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--text-muted); }
.level-meta-row span { display:flex; align-items:center; gap:5px; }
.level-meta-row svg { width:13px; height:13px; }
.level-actions { display:flex; gap:8px; flex-shrink:0; }

.chip { display:inline-flex; align-items:center; padding: 3px 10px; border-radius:999px; font-size:11px; font-weight:700; border:1px solid transparent; }
.chip.beginner { color: var(--beginner); background: rgba(56,224,255,0.1); border-color: rgba(56,224,255,0.28); }
.chip.intermediate { color: var(--intermediate); background: rgba(91,147,255,0.12); border-color: rgba(91,147,255,0.3); }
.chip.advanced { color: var(--advanced); background: rgba(176,131,255,0.12); border-color: rgba(176,131,255,0.3); }

.summary-box { border:1px dashed var(--card-border-strong); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 22px; background: rgba(255,255,255,0.015); }
.summary-box h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing:.06em; color: var(--text-muted); margin-bottom: 10px; }
.summary-box ul { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap: 6px 22px; }
.summary-box li { font-size: 13.5px; color: var(--text-secondary); padding-left: 16px; position: relative; }
.summary-box li::before { content:"→"; position:absolute; left:0; color: var(--accent-cyan); }

/* ==========================================================================
   9. CONCEPT CARDS (native <details>)
   ========================================================================== */
.card-grid { display:grid; gap: 12px; }
details.card {
  border: 1px solid var(--card-border); border-radius: var(--radius-md); background: var(--card-bg);
  overflow: hidden; transition: border-color .15s var(--ease), background .15s var(--ease);
}
details.card[open] { border-color: var(--card-border-strong); background: var(--card-bg-hover); }
details.card > summary { list-style:none; cursor:pointer; padding: 15px 18px; display:flex; align-items:center; gap:12px; }
details.card > summary::-webkit-details-marker { display:none; }
.card-chevron { flex-shrink:0; width:18px; height:18px; color: var(--text-muted); transition: transform .2s var(--ease); }
details.card[open] .card-chevron { transform: rotate(90deg); color: var(--accent-cyan); }
.card-title-wrap { flex:1; min-width:0; }
.card-title { font-size: 15px; font-weight: 700; }
.card-badges { display:flex; align-items:center; gap:6px; margin-top:5px; flex-wrap:wrap; }
.card-badges .mins { font-size:11px; color:var(--text-muted); }
.card-icon-btn { flex-shrink:0; width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); }
.card-icon-btn:hover { background: rgba(255,255,255,.06); color: var(--text-primary); }
.card-icon-btn.saved { color: var(--accent-cyan); }
.card-icon-btn.faved { color: var(--warning); }
.card-icon-btn svg { width:16px; height:16px; }
.card-icon-btn svg.filled { fill: currentColor; }

.card-body { padding: 0 18px 20px 48px; display:grid; gap:14px; }
.field-block .field-label { font-size: 11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color: var(--accent-cyan); margin-bottom:4px; display:flex; align-items:center; gap:6px; }
.field-block .field-label svg { width:12px; height:12px; }
.field-block p { font-size: 14px; color: var(--text-secondary); }
.related-tags { display:flex; flex-wrap:wrap; gap:6px; }
.related-tag { font-size:11.5px; padding:4px 10px; border-radius:999px; background: var(--bg-elev-3); border:1px solid var(--card-border); color: var(--text-secondary); }
.related-tag.linkable:hover { border-color: var(--accent-blue); color: var(--accent-blue); cursor:pointer; }
.takeaway-list li { font-size: 13.5px; color: var(--text-secondary); padding-left:18px; position:relative; margin-bottom:5px; }
.takeaway-list li::before { content:"✓"; position:absolute; left:0; color: var(--success); font-weight:700; }
.summary-line { border-left: 2px solid var(--accent-purple); padding-left:12px; font-style: italic; color: var(--text-primary); font-size:13.5px; }

/* ==========================================================================
   10. DIAGRAMS
   ========================================================================== */
.diagram-panel { border:1px solid var(--card-border); border-radius: var(--radius-lg); padding: 26px; margin: 26px 0; background: var(--card-bg); }
.diagram-panel h3 { font-size:16px; font-weight:800; margin-bottom:4px; }
.diagram-panel .diagram-sub { font-size:13px; color:var(--text-muted); margin-bottom:20px; }

/* DIKW pyramid */
.dikw-pyramid { display:flex; flex-direction:column; align-items:center; gap:6px; max-width:520px; margin:0 auto; }
.dikw-level { width: 100%; border-radius:10px; padding:14px 18px; text-align:center; font-weight:700; font-size:13.5px; color:#04121a; }
.dikw-level small { display:block; font-weight:500; font-size:11.5px; margin-top:3px; opacity:.85; }
.dikw-level.d1 { width:100%; background: linear-gradient(90deg,#38e0ff,#5b93ff); }
.dikw-level.d2 { width:80%; background: linear-gradient(90deg,#5b93ff,#7b8cff); }
.dikw-level.d3 { width:60%; background: linear-gradient(90deg,#8b7fff,#a374ff); }
.dikw-level.d4 { width:40%; background: linear-gradient(90deg,#b083ff,#e0a3ff); }

/* Lifecycle flow */
.flow-row { display:flex; flex-wrap:wrap; gap:0; align-items:stretch; justify-content:center; }
.flow-node { display:flex; align-items:center; }
.flow-box {
  border:1px solid var(--card-border-strong); border-radius:12px; padding:10px 14px; background: var(--bg-elev-2);
  font-size:12.5px; font-weight:700; text-align:center; min-width:104px;
}
.flow-box .fb-n { display:block; font-size:10px; color: var(--accent-cyan); font-weight:800; margin-bottom:2px; }
.flow-arrow { color: var(--text-muted); padding: 0 4px; font-size:16px; flex-shrink:0; }
@media (max-width: 700px) { .flow-arrow { transform: rotate(90deg); } }

/* Tree (details based) */
.tree-list { padding-left: 18px; border-left: 1px dashed var(--card-border-strong); margin-left: 8px; }
.tree-root > summary, .tree-node { list-style:none; cursor:pointer; padding: 6px 10px; border-radius:8px; font-weight:600; font-size:13.5px; }
.tree-root > summary::-webkit-details-marker, .tree-node::-webkit-details-marker { display:none; }
.tree-root > summary:hover, .tree-node:hover { background: var(--card-bg); }
.tree-leaf { font-size:13px; color: var(--text-secondary); padding:5px 10px 5px 26px; position:relative; }
.tree-leaf::before { content:"•"; position:absolute; left:12px; color: var(--accent-blue); }

/* Knowledge graph */
.kg-controls { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.kg-controls select { background: var(--bg-elev-2); border:1px solid var(--card-border-strong); color:var(--text-primary); padding:8px 12px; border-radius:var(--radius-sm); }
#kg-svg-wrap { width:100%; overflow:auto; border-radius: var(--radius-md); background: var(--bg-elev-1); border:1px solid var(--card-border); }
.kg-node-circle { fill: var(--bg-elev-3); stroke: var(--card-border-strong); stroke-width:1.5; transition: fill .15s; cursor:pointer; }
.kg-node-circle:hover { fill: var(--accent-blue); }
.kg-node-label { fill: var(--text-secondary); font-size: 10px; font-family: var(--font-sans); pointer-events:none; }
.kg-edge { stroke: var(--card-border-strong); stroke-width:1; }

/* Comparison table */
.ref-table-wrap { overflow-x:auto; border:1px solid var(--card-border); border-radius: var(--radius-md); }
table.ref-table { min-width: 480px; }
table.ref-table th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent-cyan); padding:12px 16px; background: var(--bg-elev-2); border-bottom:1px solid var(--card-border-strong); }
table.ref-table td { padding:12px 16px; font-size:13.5px; color:var(--text-secondary); border-bottom:1px solid var(--card-border); }
table.ref-table tr:last-child td { border-bottom:none; }
table.ref-table tr:hover td { background: rgba(255,255,255,.02); }

/* ==========================================================================
   11. QUIZ
   ========================================================================== */
.quiz-panel { border:1px solid var(--card-border); border-radius: var(--radius-lg); padding: 22px 24px; margin-top: 22px; background: var(--card-bg); }
.quiz-panel h3 { font-size:15px; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.quiz-q { margin-bottom: 20px; padding-bottom:20px; border-bottom:1px solid var(--card-border); }
.quiz-q:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
.quiz-q-text { font-size:14px; font-weight:600; margin-bottom:12px; }
.quiz-options { display:grid; gap:8px; }
.quiz-option { display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--card-border-strong); border-radius:10px; font-size:13.5px; text-align:left; transition: border-color .15s, background .15s; }
.quiz-option:hover { background: var(--card-bg); }
.quiz-option .qo-dot { width:16px; height:16px; border-radius:50%; border:2px solid var(--text-muted); flex-shrink:0; }
.quiz-option.correct { border-color: var(--success); background: rgba(61,220,155,0.09); }
.quiz-option.correct .qo-dot { border-color: var(--success); background: var(--success); }
.quiz-option.incorrect { border-color: var(--danger); background: rgba(255,107,107,0.09); }
.quiz-option.incorrect .qo-dot { border-color: var(--danger); background: var(--danger); }
.quiz-option[disabled] { cursor:default; }
.quiz-explain { margin-top:10px; font-size:13px; color:var(--text-secondary); padding:10px 12px; border-radius:8px; background: var(--bg-elev-2); display:none; }
.quiz-explain.show { display:block; }
.quiz-score { font-size:12.5px; color: var(--text-muted); margin-top: 4px; }

/* ==========================================================================
   12. FLASHCARDS
   ========================================================================== */
.fc-toolbar { display:flex; gap:10px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
.fc-stage { display:flex; flex-direction:column; align-items:center; gap:20px; }
.fc-card-wrap { width:100%; max-width:480px; height:260px; perspective:1400px; }
.fc-card { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .5s var(--ease); cursor:pointer; }
.fc-card.flipped { transform: rotateY(180deg); }
.fc-face { position:absolute; inset:0; backface-visibility:hidden; border-radius: var(--radius-lg); border:1px solid var(--card-border-strong); background: var(--bg-elev-2); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }
.fc-face.back { transform: rotateY(180deg); background: linear-gradient(160deg, rgba(91,147,255,0.12), rgba(176,131,255,0.08)); }
.fc-face .fc-tag { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px; }
.fc-face .fc-text { font-size: 17px; font-weight:700; }
.fc-face.back .fc-text { font-size:14px; font-weight:400; color:var(--text-secondary); line-height:1.55; }
.fc-nav { display:flex; align-items:center; gap:14px; }
.fc-counter { font-size:12.5px; color:var(--text-muted); font-variant-numeric: tabular-nums; }
.fc-round-btn { width:42px; height:42px; border-radius:50%; border:1px solid var(--card-border-strong); display:flex; align-items:center; justify-content:center; }
.fc-round-btn:hover { background: var(--card-bg); }
.fc-round-btn svg { width:18px; height:18px; }

/* ==========================================================================
   13. REFERENCE LIST BLOCKS (mental models, pitfalls, best practices, interview, case studies, cheat sheets, decision frameworks)
   ========================================================================== */
.ref-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 14px; }
.ref-card { border:1px solid var(--card-border); border-radius: var(--radius-md); padding: 18px 20px; background: var(--card-bg); }
.ref-card h4 { font-size:14.5px; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.ref-card h4 .rc-idx { flex-shrink:0; width:22px; height:22px; border-radius:7px; background: var(--bg-elev-3); display:flex; align-items:center; justify-content:center; font-size:10.5px; color:var(--accent-cyan); font-weight:800; }
.ref-card p { font-size:13.5px; color:var(--text-secondary); }
.ref-card ol { display:grid; gap:5px; margin-top:6px; }
.ref-card ol li { font-size:13px; color:var(--text-secondary); padding-left:20px; position:relative; }
.ref-card ol li::before { counter-increment: step; content: counter(step) "."; position:absolute; left:0; color:var(--accent-purple); font-weight:700; }
.ref-card ol { counter-reset: step; }
.pair-card { display:flex; align-items:stretch; gap:0; border:1px solid var(--card-border); border-radius: var(--radius-md); overflow:hidden; background: var(--card-bg); }
.pair-side { flex:1; padding:16px 18px; }
.pair-side.b { border-left:1px solid var(--card-border); }
.pair-side .ps-label { font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:800; margin-bottom:6px; }
.pair-side.a .ps-label { color: var(--accent-blue); }
.pair-side.b .ps-label { color: var(--accent-purple); }
.pair-distinction { grid-column: 1/-1; padding: 14px 18px; font-size:13.5px; color:var(--text-secondary); background: var(--bg-elev-1); border-top:1px solid var(--card-border); }
.pair-wrap { border:1px solid var(--card-border); border-radius: var(--radius-md); overflow:hidden; background: var(--card-bg); margin-bottom: 14px; }
.pair-wrap .pair-row { display:flex; }
.case-card { border:1px solid var(--card-border); border-radius: var(--radius-lg); padding: 20px 22px; background: var(--card-bg); margin-bottom:14px; }
.case-card h4 { font-size: 16px; font-weight:800; margin-bottom:12px; }
.case-card .case-block { margin-bottom:10px; }
.case-card .case-block .cb-label { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--accent-cyan); margin-bottom:3px; }
.case-card .case-block p { font-size:13.5px; color:var(--text-secondary); }
.qa-item summary { font-weight:700; font-size:14px; padding:14px 18px; cursor:pointer; list-style:none; display:flex; gap:10px; align-items:center; }
.qa-item summary::-webkit-details-marker { display:none; }
.qa-item summary .qa-chevron { width:14px; height:14px; color:var(--text-muted); flex-shrink:0; transition: transform .2s; }
.qa-item[open] summary .qa-chevron { transform: rotate(90deg); }
.qa-item .qa-answer { padding:0 18px 16px 42px; font-size:13.5px; color:var(--text-secondary); }
.qa-item { border:1px solid var(--card-border); border-radius: var(--radius-md); background: var(--card-bg); margin-bottom:10px; overflow:hidden; }

/* Glossary */
.glossary-search { margin-bottom:18px; }
.glossary-search input { width:100%; max-width:420px; background: var(--bg-elev-2); border:1px solid var(--card-border-strong); border-radius:999px; padding:10px 16px; color:var(--text-primary); }
.az-jump { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:20px; }

.az-jump button:hover { background: var(--card-bg); color:var(--text-primary); }
.glossary-letter { font-size:13px; font-weight:800; color: var(--accent-cyan); margin: 22px 0 8px; }
.glossary-item { padding: 10px 0; border-bottom:1px solid var(--card-border); }
.glossary-item dt { font-weight:700; font-size:14px; margin-bottom:3px; }
.glossary-item dd { font-size:13.5px; color:var(--text-secondary); margin:0; }

.cheat-list li { font-size:13px; color:var(--text-secondary); padding:6px 0 6px 18px; position:relative; border-bottom:1px dashed var(--card-border); }
.cheat-list li:last-child { border-bottom:none; }
.cheat-list li::before { content:"›"; position:absolute; left:0; color:var(--accent-cyan); font-weight:800; }

/* ==========================================================================
   14. MODAL / TOAST / TOOLBAR SECTION
   ========================================================================== */
.section-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
.section-title-row h2 { font-size: clamp(20px,2.4vw,26px); }

.modal-backdrop { position:fixed; inset:0; background:rgba(3,4,10,0.7); backdrop-filter: blur(3px); z-index:400; display:none; align-items:center; justify-content:center; padding:20px; }

.modal-box { background: var(--bg-elev-2); border:1px solid var(--card-border-strong); border-radius: var(--radius-lg); max-width: 480px; width:100%; padding: 26px 28px; box-shadow: var(--shadow-pop); max-height: 84vh; overflow-y:auto; }
.modal-box h3 { font-size:17px; font-weight:800; margin-bottom:16px; }

.modal-close { position:absolute; top:16px; right:16px; }

#toast { position:fixed; bottom:24px; left:50%; transform: translateX(-50%) translateY(20px); background: var(--bg-elev-3); border:1px solid var(--card-border-strong); padding:12px 20px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition: all .25s var(--ease); z-index:500; box-shadow: var(--shadow-pop); }

.empty-state { text-align:center; padding: 60px 20px; color: var(--text-muted); }
.empty-state svg { width:40px; height:40px; margin:0 auto 14px; opacity:.5; }

/* reflection box */
.reflect-box { border:1px solid var(--card-border); border-radius: var(--radius-md); padding:16px 18px; margin-top:18px; background: rgba(176,131,255,0.05); }
.reflect-box .rb-q { font-size:13.5px; font-weight:600; margin-bottom:8px; }

.reflect-box .rb-saved { font-size:11px; color: var(--success); margin-top:6px; opacity:0; transition: opacity .3s; }
.reflect-box .rb-saved.show { opacity:1; }

/* ==========================================================================
   15. PRINT
   ========================================================================== */
@media print {
  header#site-header, aside#sidebar, #progress-bar, footer#site-footer, .level-actions, .section-toolbar, .fc-toolbar, #kg-svg-wrap, .kg-controls, .card-icon-btn, .quiz-panel, .breadcrumbs { display:none !important; }

  a { text-decoration:none; }
}

const CONFUSED_PAIRS = [
  { en: { a: "Accuracy", b: "Precision", distinction: "Accuracy is how close a measurement is to the true value, while precision is how close repeated measurements are to each other. A scale that always reads 2kg too heavy is precise (consistent) but not accurate." }, pt: { a: "Acurácia", b: "Precisão", distinction: "Acurácia é o quão perto uma medição está do valor real, enquanto precisão é o quão perto medições repetidas estão umas das outras. Uma balança que sempre marca 2kg a mais é precisa (consistente), mas não acurada." } },
  { en: { a: "Correlation", b: "Causation", distinction: "Correlation means two variables move together, while causation means one variable directly produces a change in the other. Ice cream sales and drowning rates correlate because both rise in summer, but one does not cause the other." }, pt: { a: "Correlação", b: "Causalidade", distinction: "Correlação significa que duas variáveis se movem juntas, enquanto causalidade significa que uma variável provoca diretamente uma mudança na outra. Vendas de sorvete e afogamentos são correlacionados porque ambos aumentam no verão, mas um não causa o outro." } },
  { en: { a: "Population", b: "Sample", distinction: "A population is every member of the group being studied, while a sample is a subset drawn from that population to make inferences about it. Surveying all 50,000 employees is a population study; surveying 500 of them is a sample." }, pt: { a: "População", b: "Amostra", distinction: "População é o conjunto completo de elementos do grupo estudado, enquanto amostra é um subconjunto extraído dessa população para fazer inferências sobre ela. Pesquisar todos os 50.000 funcionários é um estudo populacional; pesquisar 500 deles é uma amostra." } },
  { en: { a: "Type I Error", b: "Type II Error", distinction: "A Type I error is a false positive — rejecting a true null hypothesis (e.g., concluding a drug works when it doesn't), while a Type II error is a false negative — failing to reject a false null hypothesis (e.g., missing a drug that actually works)." }, pt: { a: "Erro Tipo I", b: "Erro Tipo II", distinction: "Um erro Tipo I é um falso positivo — rejeitar uma hipótese nula verdadeira (por exemplo, concluir que um remédio funciona quando não funciona), enquanto um erro Tipo II é um falso negativo — não rejeitar uma hipótese nula falsa (por exemplo, não perceber que um remédio realmente funciona)." } },
  { en: { a: "Normalization", b: "Standardization", distinction: "Normalization rescales data to a fixed range, typically 0 to 1, while standardization rescales data to have a mean of 0 and a standard deviation of 1. Normalization suits bounded features like pixel values; standardization suits features assumed to be normally distributed." }, pt: { a: "Normalização", b: "Padronização", distinction: "Normalização reescala os dados para um intervalo fixo, geralmente de 0 a 1, enquanto padronização reescala os dados para terem média 0 e desvio padrão 1. A normalização é útil para variáveis limitadas, como valores de pixel; a padronização é útil quando se assume distribuição normal." } },
  { en: { a: "Data Warehouse", b: "Data Lake", distinction: "A data warehouse stores structured, processed data optimized for business reporting and analytics, while a data lake stores raw data of any format — structured, semi-structured, or unstructured — at low cost for later processing." }, pt: { a: "Data Warehouse", b: "Data Lake", distinction: "Um data warehouse armazena dados estruturados e já processados, otimizados para relatórios e análises de negócio, enquanto um data lake armazena dados brutos em qualquer formato — estruturado, semiestruturado ou não estruturado — a baixo custo, para processamento posterior." } },
  { en: { a: "Star Schema", b: "Snowflake Schema", distinction: "A star schema has a fact table connected directly to denormalized dimension tables, favoring query simplicity, while a snowflake schema normalizes those dimensions into related sub-tables, favoring storage efficiency at the cost of more complex joins." }, pt: { a: "Esquema Estrela", b: "Esquema Floco de Neve", distinction: "Um esquema estrela tem uma tabela fato conectada diretamente a tabelas dimensão desnormalizadas, priorizando consultas simples, enquanto um esquema floco de neve normaliza essas dimensões em subtabelas relacionadas, priorizando eficiência de armazenamento em troca de junções mais complexas." } },
  { en: { a: "Overfitting", b: "Underfitting", distinction: "Overfitting occurs when a model learns the noise in the training data and performs poorly on new data, while underfitting occurs when a model is too simple to capture the underlying pattern, performing poorly even on training data." }, pt: { a: "Overfitting", b: "Underfitting", distinction: "Overfitting (sobreajuste) ocorre quando um modelo aprende o ruído dos dados de treino e tem desempenho ruim em dados novos, enquanto underfitting (subajuste) ocorre quando o modelo é simples demais para capturar o padrão subjacente, tendo desempenho ruim até nos dados de treino." } },
  { en: { a: "Mean", b: "Median", distinction: "The mean is the arithmetic average of all values, sensitive to extreme outliers, while the median is the middle value when data is sorted, more robust to skew. In income data with a few billionaires, the median gives a more representative picture than the mean." }, pt: { a: "Média", b: "Mediana", distinction: "A média é o valor aritmético de todos os dados, sensível a valores extremos, enquanto a mediana é o valor central quando os dados são ordenados, mais resistente a distorções. Em dados de renda com alguns bilionários, a mediana representa melhor a realidade do que a média." } },
  { en: { a: "KPI", b: "Metric", distinction: "A metric is any quantifiable measure of performance, while a KPI (Key Performance Indicator) is a specific metric selected because it directly reflects progress toward a strategic goal. Page views is a metric; monthly active users tied to a growth target is a KPI." }, pt: { a: "KPI", b: "Métrica", distinction: "Uma métrica é qualquer medida quantificável de desempenho, enquanto um KPI (indicador-chave de desempenho) é uma métrica específica escolhida por refletir diretamente o progresso em relação a uma meta estratégica. Visualizações de página é uma métrica; usuários ativos mensais vinculados a uma meta de crescimento é um KPI." } },
  { en: { a: "Data", b: "Information", distinction: "Data is raw, uninterpreted facts and figures, while information is data that has been processed, organized, and given context so it becomes meaningful and useful for decisions." }, pt: { a: "Dado", b: "Informação", distinction: "Dado é o fato bruto, sem interpretação, enquanto informação é o dado processado, organizado e contextualizado, tornando-se útil e significativo para decisões." } },
  { en: { a: "Bias", b: "Noise", distinction: "Bias is a systematic error that consistently skews results in one direction, while noise is random, unpredictable variation with no consistent direction. A scale always reading 5kg heavy has bias; a scale that reads randomly high or low each time has noise." }, pt: { a: "Viés", b: "Ruído", distinction: "Viés (bias) é um erro sistemático que distorce os resultados sempre na mesma direção, enquanto ruído (noise) é uma variação aleatória e imprevisível, sem direção consistente. Uma balança que sempre marca 5kg a mais tem viés; uma que varia aleatoriamente para mais ou para menos tem ruído." } },
  { en: { a: "Validity", b: "Reliability", distinction: "Validity is whether a measurement actually captures the concept it's supposed to measure, while reliability is whether that measurement produces consistent results when repeated. A survey question can be reliable (consistent answers) but not valid if it measures the wrong construct." }, pt: { a: "Validade", b: "Confiabilidade", distinction: "Validade é se uma medição realmente captura o conceito que deveria medir, enquanto confiabilidade é se essa medição produz resultados consistentes quando repetida. Uma pergunta de pesquisa pode ser confiável (respostas consistentes) mas não válida, se estiver medindo o construto errado." } },
  { en: { a: "OLTP", b: "OLAP", distinction: "OLTP (Online Transaction Processing) systems handle high volumes of short, frequent read/write transactions like order entry, while OLAP (Online Analytical Processing) systems are optimized for complex queries and aggregations over large historical datasets for analysis." }, pt: { a: "OLTP", b: "OLAP", distinction: "Sistemas OLTP (processamento de transações online) lidam com grandes volumes de transações curtas e frequentes de leitura/escrita, como o registro de pedidos, enquanto sistemas OLAP (processamento analítico online) são otimizados para consultas complexas e agregações sobre grandes volumes de dados históricos para análise." } },
];

const MENTAL_MODELS = [
  { en: { name: "Occam's Razor", description: "Among competing explanations that fit the data equally well, the simplest one is usually the best starting point. An analyst should rule out a simple data pipeline bug before reaching for an exotic market theory to explain a metric spike." }, pt: { name: "Navalha de Occam", description: "Entre explicações concorrentes que se ajustam igualmente bem aos dados, a mais simples costuma ser o melhor ponto de partida. O analista deve descartar um erro simples no pipeline de dados antes de recorrer a uma teoria de mercado exótica para explicar um pico em uma métrica." } },
  { en: { name: "First Principles Thinking", description: "Break a problem down to its fundamental, verified truths and reason up from there, instead of relying on analogy or convention. Instead of copying a competitor's dashboard, an analyst asks what decisions the business actually needs to make." }, pt: { name: "Pensamento a partir de Princípios Básicos", description: "Decompor um problema em suas verdades fundamentais e comprovadas, e raciocinar a partir delas, em vez de recorrer a analogias ou convenções. Em vez de copiar o dashboard de um concorrente, o analista pergunta quais decisões o negócio realmente precisa tomar." } },
  { en: { name: "The Pareto Principle (80/20)", description: "Roughly 80% of effects often come from 20% of causes. An analyst investigating customer complaints might find that 20% of product defects generate 80% of support tickets, pointing to where to focus first." }, pt: { name: "Princípio de Pareto (80/20)", description: "Aproximadamente 80% dos efeitos costumam vir de 20% das causas. Um analista investigando reclamações de clientes pode descobrir que 20% dos defeitos de produto geram 80% dos chamados de suporte, indicando onde focar primeiro." } },
  { en: { name: "Second-Order Thinking", description: "Consider not just the immediate effect of a decision but the downstream consequences it triggers. Cutting a marketing channel may improve short-term cost metrics but reduce long-term customer acquisition — an analyst should model both effects." }, pt: { name: "Pensamento de Segunda Ordem", description: "Considerar não apenas o efeito imediato de uma decisão, mas as consequências que ela desencadeia adiante. Cortar um canal de marketing pode melhorar métricas de custo no curto prazo, mas reduzir a aquisição de clientes no longo prazo — o analista deve modelar os dois efeitos." } },
  { en: { name: "Inversion", description: "Instead of asking how to succeed, ask how the analysis could fail or mislead, and work backward to prevent it. Before shipping a dashboard, an analyst asks 'what would make this number wrong?' and checks those failure points first." }, pt: { name: "Inversão", description: "Em vez de perguntar como ter sucesso, perguntar como a análise poderia falhar ou induzir a erro, e trabalhar de trás para frente para evitar isso. Antes de publicar um dashboard, o analista pergunta 'o que faria esse número estar errado?' e verifica esses pontos primeiro." } },
  { en: { name: "The Map Is Not the Territory", description: "A model, dashboard, or dataset is a simplified representation of reality, not reality itself, and it can diverge from what's actually happening. An analyst should periodically validate the data model against real-world observation." }, pt: { name: "O Mapa Não É o Território", description: "Um modelo, dashboard ou conjunto de dados é uma representação simplificada da realidade, não a realidade em si, e pode divergir do que está de fato acontecendo. O analista deve validar periodicamente o modelo de dados com observações do mundo real." } },
  { en: { name: "Confirmation Bias Guard", description: "Actively seek evidence that could disprove your hypothesis, not just evidence that confirms it, since it's natural to notice data that fits what you already believe. Deliberately look at the segments or time periods that contradict your favored story." }, pt: { name: "Proteção contra Viés de Confirmação", description: "Buscar ativamente evidências que possam refutar sua hipótese, e não apenas as que a confirmam, já que é natural notar dados que se encaixam no que já se acredita. Analisar deliberadamente os segmentos ou períodos que contradizem a narrativa preferida." } },
  { en: { name: "Base Rate Thinking", description: "Ground any probability judgment in the underlying frequency of the event in the general population before adjusting for specific evidence. A 99%-accurate fraud model still produces mostly false positives if fraud's base rate is 0.1%." }, pt: { name: "Pensamento sobre Taxa Base", description: "Ancorar qualquer julgamento de probabilidade na frequência do evento na população em geral antes de ajustar por evidências específicas. Um modelo de fraude com 99% de acurácia ainda gera majoritariamente falsos positivos se a taxa base de fraude for 0,1%." } },
  { en: { name: "The Streetlight Effect", description: "The tendency to search for answers only where it's easiest to look — like the available data — rather than where the real answer likely lies. An analyst should ask what data is missing, not just what the current dataset conveniently shows." }, pt: { name: "Efeito do Poste de Luz", description: "A tendência de procurar respostas apenas onde é mais fácil olhar — como nos dados disponíveis — em vez de onde a resposta real provavelmente está. O analista deve perguntar quais dados estão faltando, não apenas o que o conjunto de dados atual mostra convenientemente." } },
];

const PITFALLS = [
  { en: { title: "P-Hacking", description: "Running many statistical tests or slicing data repeatedly until a 'significant' result appears by chance. Avoid it by pre-registering hypotheses and correcting for multiple comparisons." }, pt: { title: "P-Hacking", description: "Rodar diversos testes estatísticos ou fatiar os dados repetidamente até encontrar por acaso um resultado 'significativo'. Evite pré-registrando hipóteses e corrigindo para comparações múltiplas." } },
  { en: { title: "Survivorship Bias", description: "Drawing conclusions only from the data points that 'survived' a selection process while ignoring those that dropped out. Analyzing only current customers while ignoring churned ones will overstate satisfaction." }, pt: { title: "Viés de Sobrevivência", description: "Tirar conclusões apenas dos dados que 'sobreviveram' a um processo de seleção, ignorando os que ficaram pelo caminho. Analisar somente clientes atuais e ignorar os que cancelaram superestima a satisfação real." } },
  { en: { title: "Confusing Correlation with Causation", description: "Assuming that because two variables move together, one must cause the other, without ruling out confounders or reverse causality. Always ask what controlled test or natural experiment could confirm the causal claim." }, pt: { title: "Confundir Correlação com Causalidade", description: "Assumir que, porque duas variáveis se movem juntas, uma causa a outra, sem descartar fatores de confusão ou causalidade reversa. Sempre pergunte que teste controlado ou experimento natural poderia confirmar a relação causal." } },
  { en: { title: "Cherry-Picking Date Ranges", description: "Selecting a start and end date for a chart that flatters a chosen narrative rather than reflecting the full trend. Always show enough history to reveal seasonality and volatility, and disclose why a range was chosen." }, pt: { title: "Selecionar Períodos a Dedo", description: "Escolher a data de início e fim de um gráfico que favoreça uma narrativa específica, em vez de refletir a tendência completa. Sempre mostre histórico suficiente para revelar sazonalidade e volatilidade, e explique por que aquele período foi escolhido." } },
  { en: { title: "Vanity Metrics", description: "Focusing on numbers that look good and go up but don't connect to actual business value, like total signups instead of active, paying users. Prioritize metrics that are tied to a decision or outcome." }, pt: { title: "Métricas de Vaidade", description: "Focar em números que parecem bons e sempre crescem, mas não se conectam a valor real de negócio, como total de cadastros em vez de usuários ativos e pagantes. Priorize métricas ligadas a uma decisão ou resultado concreto." } },
  { en: { title: "Over-Engineering Dashboards", description: "Cramming a dashboard with every possible chart and filter instead of the few visuals that answer the audience's actual question. Start from the decision the dashboard supports and cut anything that doesn't serve it." }, pt: { title: "Dashboards Superengenheirados", description: "Encher um dashboard com todos os gráficos e filtros possíveis, em vez dos poucos visuais que respondem à real pergunta do público. Comece pela decisão que o dashboard apoia e corte tudo que não contribui para isso." } },
  { en: { title: "Ignoring Data Lineage", description: "Using a field or table without understanding where it came from, how it was transformed, or what business logic defines it. Trace a metric back to its source before trusting it in a high-stakes report." }, pt: { title: "Ignorar a Linhagem dos Dados", description: "Usar um campo ou tabela sem entender de onde ele veio, como foi transformado ou qual lógica de negócio o define. Rastreie uma métrica até sua origem antes de confiar nela em um relatório de alto impacto." } },
  { en: { title: "Small-Sample Overconfidence", description: "Drawing strong conclusions from a handful of data points or a short test window, where random noise can look like a real signal. Check whether the sample size and duration are sufficient for the effect size you're claiming." }, pt: { title: "Excesso de Confiança com Amostra Pequena", description: "Tirar conclusões fortes a partir de poucos pontos de dados ou uma janela de teste curta, onde ruído aleatório pode parecer um sinal real. Verifique se o tamanho da amostra e a duração são suficientes para o efeito que está sendo afirmado." } },
  { en: { title: "Not Questioning the Data Source", description: "Treating a dataset as ground truth without asking how it was collected, what it excludes, or what biases the collection method introduces. Always ask 'who collected this, how, and what might be missing?' before analyzing." }, pt: { title: "Não Questionar a Fonte dos Dados", description: "Tratar um conjunto de dados como verdade absoluta sem perguntar como foi coletado, o que exclui ou quais vieses o método de coleta pode introduzir. Sempre pergunte 'quem coletou isso, como, e o que pode estar faltando?' antes de analisar." } },
  { en: { title: "Chart Junk Overload", description: "Decorating a chart with unnecessary 3D effects, gridlines, colors, or labels that add visual noise without adding information. Strip a chart down to the minimum elements needed to convey the message clearly." }, pt: { title: "Excesso de Elementos Visuais (Chart Junk)", description: "Decorar um gráfico com efeitos 3D, linhas de grade, cores ou rótulos desnecessários que adicionam ruído visual sem agregar informação. Reduza o gráfico aos elementos mínimos necessários para transmitir a mensagem com clareza." } },
];

const BEST_PRACTICES = [
  { en: { title: "Document Your Assumptions", description: "Write down every assumption made during an analysis — filters applied, definitions used, data excluded — so others (and future you) can evaluate and reproduce the work." }, pt: { title: "Documente suas Premissas", description: "Registre toda premissa usada na análise — filtros aplicados, definições adotadas, dados excluídos — para que outras pessoas (e você mesmo no futuro) possam avaliar e reproduzir o trabalho." } },
  { en: { title: "Version Your Datasets", description: "Keep track of which version of a dataset or extract an analysis was based on, since source data changes over time and numbers need to be reproducible." }, pt: { title: "Versione seus Conjuntos de Dados", description: "Mantenha registro de qual versão de um conjunto de dados ou extração foi usada em uma análise, já que os dados de origem mudam com o tempo e os números precisam ser reproduzíveis." } },
  { en: { title: "Validate Before You Visualize", description: "Sanity-check totals, ranges, and row counts against a known source before building charts, so errors are caught before they reach a stakeholder's screen." }, pt: { title: "Valide Antes de Visualizar", description: "Confira totais, intervalos e contagens de linhas contra uma fonte conhecida antes de construir gráficos, para que erros sejam pegos antes de chegar à tela de um stakeholder." } },
  { en: { title: "Write for Your Audience, Not Yourself", description: "Tailor the level of technical detail, vocabulary, and chart complexity to who will actually read the analysis, not to demonstrate analytical sophistication." }, pt: { title: "Escreva para o Público, Não para Você Mesmo", description: "Ajuste o nível de detalhe técnico, o vocabulário e a complexidade dos gráficos a quem realmente vai ler a análise, em vez de tentar demonstrar sofisticação analítica." } },
  { en: { title: "Always Show Uncertainty", description: "Present confidence intervals, margins of error, or sample sizes alongside point estimates, so decision-makers understand how much to trust a number." }, pt: { title: "Sempre Mostre a Incerteza", description: "Apresente intervalos de confiança, margens de erro ou tamanhos de amostra junto com as estimativas pontuais, para que quem decide entenda o quanto pode confiar em um número." } },
  { en: { title: "Prefer Simple Charts", description: "Default to the simplest chart type that accurately conveys the message — bar and line charts communicate faster than exotic visualizations for most business audiences." }, pt: { title: "Prefira Gráficos Simples", description: "Use por padrão o tipo de gráfico mais simples que transmita a mensagem com precisão — gráficos de barra e linha comunicam mais rápido do que visualizações exóticas para a maioria dos públicos de negócio." } },
  { en: { title: "Reproducibility Over One-Off Scripts", description: "Build analyses as re-runnable, documented queries or notebooks rather than manual spreadsheet edits, so the same result can be regenerated as data updates." }, pt: { title: "Reprodutibilidade em Vez de Scripts Descartáveis", description: "Construa análises como consultas ou notebooks documentados e reexecutáveis, em vez de edições manuais em planilhas, para que o mesmo resultado possa ser regenerado conforme os dados são atualizados." } },
  { en: { title: "Involve Stakeholders Early", description: "Share draft findings and definitions with stakeholders before finalizing an analysis, catching misunderstandings about scope or metrics early rather than after full delivery." }, pt: { title: "Envolva os Stakeholders Cedo", description: "Compartilhe achados preliminares e definições com os stakeholders antes de finalizar a análise, identificando mal-entendidos sobre escopo ou métricas cedo, e não após a entrega completa." } },
  { en: { title: "Separate Descriptive from Prescriptive Claims", description: "Clearly distinguish 'what the data shows' from 'what we recommend doing about it', so stakeholders can evaluate the evidence and the judgment separately." }, pt: { title: "Separe Constatações de Recomendações", description: "Distinga claramente 'o que os dados mostram' de 'o que recomendamos fazer a respeito', para que os stakeholders possam avaliar a evidência e o julgamento separadamente." } },
  { en: { title: "Sanity-Check with a Back-of-Envelope Estimate", description: "Before trusting a complex model's output, do a rough manual estimate to see if the result is in the right ballpark, catching order-of-magnitude errors quickly." }, pt: { title: "Confira com uma Estimativa Rápida (de Guardanapo)", description: "Antes de confiar no resultado de um modelo complexo, faça uma estimativa manual e aproximada para ver se o resultado está na ordem de grandeza certa, identificando erros grosseiros rapidamente." } },
];

const INTERVIEW_QUESTIONS = [
  { en: { question: "How would you explain a p-value to a non-technical stakeholder?", answer: "I'd avoid statistical jargon and frame it as a measure of surprise: if there were truly no effect, a p-value tells us how likely we'd be to see results this strong just by chance. A small p-value means the pattern is unlikely to be a fluke, but I'd stress it doesn't tell us the size or business importance of the effect." }, pt: { question: "Como você explicaria um p-valor para um stakeholder não técnico?", answer: "Eu evitaria jargão estatístico e explicaria como uma medida de surpresa: se realmente não houvesse efeito nenhum, o p-valor mostra quão provável seria ver um resultado tão forte só por acaso. Um p-valor pequeno indica que o padrão dificilmente é coincidência, mas eu deixaria claro que ele não indica o tamanho ou a relevância prática do efeito." } },
  { en: { question: "Walk me through how you'd investigate a sudden drop in a metric.", answer: "I'd first confirm the drop is real by checking for data pipeline issues or reporting bugs, then segment the metric by dimensions like channel, geography, or device to isolate where the drop is concentrated. From there I'd look for correlated events — a product change, outage, or seasonal pattern — and validate the leading hypothesis with further data before communicating a root cause." }, pt: { question: "Explique como você investigaria uma queda repentina em uma métrica.", answer: "Antes de tudo eu confirmaria se a queda é real, verificando problemas no pipeline de dados ou bugs de relatório, e depois segmentaria a métrica por dimensões como canal, região ou dispositivo para isolar onde a queda está concentrada. A partir daí, buscaria eventos correlacionados — uma mudança de produto, uma instabilidade técnica ou um padrão sazonal — e validaria a hipótese principal com mais dados antes de comunicar uma causa raiz." } },
  { en: { question: "How do you decide which chart type to use?", answer: "I start from the question the chart needs to answer — comparison, trend, distribution, relationship, or composition — and pick the simplest chart type that fits that category, like a line chart for trends or a bar chart for comparisons. I also consider the audience's familiarity with chart types and avoid anything that requires extra explanation." }, pt: { question: "Como você decide qual tipo de gráfico usar?", answer: "Eu parto da pergunta que o gráfico precisa responder — comparação, tendência, distribuição, relação ou composição — e escolho o tipo mais simples que se encaixa nessa categoria, como um gráfico de linha para tendências ou de barras para comparações. Também considero a familiaridade do público com os tipos de gráfico e evito qualquer coisa que exija explicação extra." } },
  { en: { question: "What's the difference between a data warehouse and a data lake?", answer: "A data warehouse stores structured, cleaned data optimized for fast business reporting, typically using a schema defined before data is loaded. A data lake stores raw data in any format at low cost, with structure applied later when the data is actually used, which gives more flexibility but requires more governance to avoid becoming a 'data swamp.'" }, pt: { question: "Qual é a diferença entre um data warehouse e um data lake?", answer: "Um data warehouse armazena dados estruturados e tratados, otimizados para relatórios rápidos, geralmente com um esquema definido antes da carga dos dados. Um data lake armazena dados brutos em qualquer formato a baixo custo, aplicando estrutura apenas quando os dados são efetivamente usados, o que dá mais flexibilidade, mas exige mais governança para não virar um 'pântano de dados'." } },
  { en: { question: "How do you handle missing data?", answer: "I first try to understand why the data is missing — at random, or systematically tied to some other variable — since that changes the right fix. Depending on the case, I might impute with a statistically sound method, exclude the records with clear documentation of the impact, or flag the gap to the data source owner if it points to a collection problem." }, pt: { question: "Como você lida com dados ausentes?", answer: "Primeiro busco entender por que os dados estão faltando — de forma aleatória ou sistematicamente ligada a outra variável — já que isso muda a solução correta. Dependendo do caso, posso imputar com um método estatisticamente adequado, excluir os registros documentando claramente o impacto, ou sinalizar a lacuna ao responsável pela fonte de dados, caso indique um problema de coleta." } },
  { en: { question: "Tell me about a time your analysis changed a business decision.", answer: "I'd describe the business question at stake, the specific analysis I ran, and the concrete decision that changed as a result — for example, a segmentation analysis that led leadership to redirect budget toward a higher-retention customer segment. I'd emphasize the measurable outcome after the decision was implemented." }, pt: { question: "Conte sobre uma vez em que sua análise mudou uma decisão de negócio.", answer: "Eu descreveria a pergunta de negócio em jogo, a análise específica que fiz e a decisão concreta que mudou como resultado — por exemplo, uma análise de segmentação que levou a liderança a redirecionar orçamento para um segmento de clientes com maior retenção. Eu enfatizaria o resultado mensurável após a decisão ser implementada." } },
  { en: { question: "How do you approach a request for a metric that doesn't exist yet in the data?", answer: "I'd clarify the business definition of the metric with the requester first, then check whether it can be derived from existing raw data or requires new instrumentation. I'd document the definition clearly and validate the first calculation against a manual spot-check before it's used broadly." }, pt: { question: "Como você aborda um pedido de uma métrica que ainda não existe nos dados?", answer: "Primeiro eu esclareceria com quem solicitou a definição de negócio da métrica, depois verificaria se ela pode ser derivada dos dados brutos existentes ou se exige nova instrumentação. Documentaria a definição com clareza e validaria o primeiro cálculo com uma checagem manual antes de disponibilizá-la amplamente." } },
  { en: { question: "How do you ensure your analysis is unbiased?", answer: "I actively look for evidence that would contradict my initial hypothesis, check whether the data source itself introduces selection bias, and where possible have a colleague review the methodology before conclusions go out. I also separate what the data objectively shows from any recommendation I'm making." }, pt: { question: "Como você garante que sua análise seja isenta de viés?", answer: "Busco ativamente evidências que contradigam minha hipótese inicial, verifico se a própria fonte de dados introduz viés de seleção e, quando possível, peço que um colega revise a metodologia antes das conclusões serem divulgadas. Também separo o que os dados mostram objetivamente da recomendação que estou fazendo." } },
  { en: { question: "Describe your process for exploratory data analysis on a new dataset.", answer: "I start by checking the shape, data types, and missingness of the dataset, then look at summary statistics and distributions for key variables to spot outliers or anomalies. From there I explore relationships between variables relevant to the business question, using visualizations to guide which patterns are worth investigating further." }, pt: { question: "Descreva seu processo de análise exploratória de dados em um novo conjunto de dados.", answer: "Começo verificando o formato, os tipos de dado e a quantidade de valores ausentes do conjunto de dados, depois analiso estatísticas resumo e distribuições das variáveis-chave para identificar outliers ou anomalias. A partir daí, exploro relações entre variáveis relevantes para a pergunta de negócio, usando visualizações para guiar quais padrões merecem investigação mais profunda." } },
  { en: { question: "How would you explain the difference between correlation and causation to a stakeholder pushing for a quick conclusion?", answer: "I'd use a concrete, relatable example — like ice cream sales and drowning both rising in summer — to show two things can move together without one causing the other. Then I'd explain what evidence, such as a controlled experiment or a time-lagged relationship, would be needed to support a causal claim before we act on it." }, pt: { question: "Como você explicaria a diferença entre correlação e causalidade para um stakeholder que quer uma conclusão rápida?", answer: "Eu usaria um exemplo concreto e fácil de entender — como vendas de sorvete e afogamentos aumentando juntos no verão — para mostrar que duas coisas podem se mover juntas sem que uma cause a outra. Depois explicaria que tipo de evidência, como um experimento controlado ou uma relação defasada no tempo, seria necessária para sustentar uma afirmação causal antes de agirmos sobre ela." } },
  { en: { question: "How do you prioritize multiple analysis requests with competing deadlines?", answer: "I evaluate each request by the size of the decision it informs and the cost of delay, then communicate trade-offs transparently to stakeholders rather than silently reprioritizing. I also look for requests that share underlying data work, so I can batch effort efficiently." }, pt: { question: "Como você prioriza múltiplas solicitações de análise com prazos concorrentes?", answer: "Avalio cada solicitação pelo tamanho da decisão que ela informa e pelo custo de atraso, e comunico os trade-offs de forma transparente aos stakeholders, em vez de repriorizar silenciosamente. Também busco pedidos que compartilham trabalho de dados em comum, para agrupar o esforço com eficiência." } },
  { en: { question: "What's your approach to designing an A/B test?", answer: "I define a single clear success metric and hypothesis upfront, calculate the required sample size for adequate statistical power, and make sure randomization is truly independent between groups. I also decide the test duration and analysis plan before launching to avoid peeking at results and stopping early." }, pt: { question: "Qual é a sua abordagem para desenhar um teste A/B?", answer: "Defino uma única métrica de sucesso e uma hipótese clara desde o início, calculo o tamanho de amostra necessário para poder estatístico adequado e garanto que a randomização entre os grupos seja realmente independente. Também defino a duração do teste e o plano de análise antes do lançamento, para evitar espiar os resultados e parar o teste cedo demais." } },
  { en: { question: "How do you communicate a negative or inconclusive result to stakeholders who expected good news?", answer: "I present the finding honestly and clearly, framing it around what we learned and what decision it should inform, rather than softening or hiding the result. I pair it with next steps — whether that's a different approach, more data, or accepting the null result — so the conversation stays constructive." }, pt: { question: "Como você comunica um resultado negativo ou inconclusivo a stakeholders que esperavam boas notícias?", answer: "Apresento o resultado com honestidade e clareza, focando no que aprendemos e em qual decisão isso deve orientar, em vez de suavizar ou esconder o resultado. Complemento com próximos passos — seja uma abordagem diferente, mais dados, ou aceitar o resultado nulo — para manter a conversa construtiva." } },
  { en: { question: "What steps do you take to validate a dashboard before releasing it?", answer: "I cross-check the dashboard's key totals against a trusted source like the underlying database or a finance report, test edge cases like filters and date ranges, and have someone unfamiliar with the build try to use it to catch confusing labels or logic. I also document the metric definitions directly in the dashboard." }, pt: { question: "Que passos você segue para validar um dashboard antes de publicá-lo?", answer: "Confiro os totais principais do dashboard contra uma fonte confiável, como o banco de dados original ou um relatório financeiro, testo casos extremos como filtros e intervalos de datas, e peço para alguém que não participou da construção tentar usá-lo, para identificar rótulos ou lógica confusos. Também documento as definições das métricas diretamente no dashboard." } },
  { en: { question: "How do you handle a stakeholder who disagrees with your analysis's conclusion?", answer: "I first make sure I understand the specific point of disagreement — whether it's about the data, the methodology, or the interpretation — and walk through my reasoning transparently. If they raise a valid point I hadn't considered, I revisit the analysis; if not, I present the supporting evidence clearly while respecting that the final decision may still weigh other factors." }, pt: { question: "Como você lida com um stakeholder que discorda da conclusão da sua análise?", answer: "Primeiro procuro entender exatamente qual é o ponto de discordância — se é sobre os dados, a metodologia ou a interpretação — e explico meu raciocínio com transparência. Se a pessoa levanta um ponto válido que eu não tinha considerado, revejo a análise; caso contrário, apresento as evidências com clareza, respeitando que a decisão final pode considerar outros fatores também." } },
  { en: { question: "What's the difference between structured, semi-structured, and unstructured data, and why does it matter?", answer: "Structured data fits neatly into rows and columns with a fixed schema, like a sales table; semi-structured data has some organizational tags but no rigid schema, like JSON or XML; unstructured data has no predefined structure at all, like free text or images. It matters because it determines which storage and analysis tools are appropriate for each." }, pt: { question: "Qual é a diferença entre dados estruturados, semiestruturados e não estruturados, e por que isso importa?", answer: "Dados estruturados se encaixam em linhas e colunas com um esquema fixo, como uma tabela de vendas; dados semiestruturados têm alguma organização, mas sem esquema rígido, como JSON ou XML; dados não estruturados não têm estrutura predefinida, como texto livre ou imagens. Isso importa porque determina quais ferramentas de armazenamento e análise são adequadas para cada caso." } },
  { en: { question: "How do you decide when an outlier should be removed versus kept in an analysis?", answer: "I investigate whether the outlier reflects a data entry or measurement error, in which case it should generally be corrected or removed, versus a legitimate extreme but real event, which should usually be kept and possibly analyzed separately. The decision should always be documented so it's transparent, not just done silently to make results look cleaner." }, pt: { question: "Como você decide quando um outlier deve ser removido ou mantido em uma análise?", answer: "Investigo se o outlier reflete um erro de digitação ou de medição, caso em que geralmente deve ser corrigido ou removido, ou se é um evento extremo mas legítimo, que normalmente deve ser mantido e possivelmente analisado à parte. Essa decisão deve sempre ser documentada com transparência, e não feita silenciosamente só para deixar os resultados mais 'limpos'." } },
  { en: { question: "How do you keep your technical skills and business acumen balanced as an analyst?", answer: "I make a point of understanding the 'why' behind every request — the business context and the decision it feeds — not just the technical 'how' of pulling the data. I also invest ongoing time in both directions: learning new tools and techniques, and staying close to the business by talking regularly with stakeholders about their goals." }, pt: { question: "Como você mantém equilíbrio entre habilidades técnicas e visão de negócio como analista?", answer: "Procuro entender o 'porquê' por trás de cada solicitação — o contexto de negócio e a decisão que ela vai apoiar — e não apenas o 'como' técnico de extrair os dados. Também invisto tempo constante nas duas frentes: aprendendo novas ferramentas e técnicas, e me mantendo próximo do negócio, conversando regularmente com os stakeholders sobre seus objetivos." } },
];

function debounce(fn, wait){ let timer; return function(){ const args=arguments, ctx=this; clearTimeout(timer); timer=setTimeout(function(){ fn.apply(ctx,args); }, wait); }; }
function throttle(fn, wait){ let last=0, timer=null; return function(){ const args=arguments, ctx=this, now=Date.now(); if(now-last>=wait){ last=now; fn.apply(ctx,args); } else { clearTimeout(timer); timer=setTimeout(function(){ last=Date.now(); fn.apply(ctx,args); }, wait-(now-last)); } }; }

function wrapSvgText(label, x, y){
  const words = String(label).split(' ');
  let lines;
  if(words.length<=2){ lines=[words.join(' ')]; }
  else { const mid=Math.ceil(words.length/2); lines=[words.slice(0,mid).join(' '), words.slice(mid).join(' ')]; }
  const startDy = lines.length>1 ? -6 : 0;
  return lines.map(function(l,i){ return '<tspan x="'+x+'" dy="'+(i===0?startDy:14)+'">'+l+'</tspan>'; }).join('');
}
function renderMindMap(centerLabel, branches, titleKey, subKey){
  const size = 380, cx=size/2, cy=size/2, r=132;
  const nodes = branches.map(function(b,i){
    const angle = (Math.PI*2*i/branches.length) - Math.PI/2;
    return { x: cx+r*Math.cos(angle), y: cy+r*Math.sin(angle), label: b };
  });
  const lines = nodes.map(function(n){ return '<line class="kg-edge" x1="'+cx+'" y1="'+cy+'" x2="'+n.x+'" y2="'+n.y+'"/>'; }).join('');
  const circles = nodes.map(function(n){
    return '<circle class="kg-node-circle" cx="'+n.x+'" cy="'+n.y+'" r="46"/><text class="kg-node-label" x="'+n.x+'" y="'+n.y+'" text-anchor="middle" dominant-baseline="middle">'+wrapSvgText(esc(n.label), n.x, n.y)+'</text>';
  }).join('');
  return '<div class="diagram-panel"><h3>'+t(titleKey)+'</h3><p class="diagram-sub">'+t(subKey)+'</p>'
    + '<div style="display:flex;justify-content:center;"><svg viewBox="0 0 '+size+' '+size+'" width="100%" style="max-width:460px;">'
      + lines
      + '<circle cx="'+cx+'" cy="'+cy+'" r="54" style="fill:var(--accent-blue);stroke:var(--accent-cyan);stroke-width:1.5;"/>'
      + '<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="middle" style="fill:#04121a;font-weight:800;font-size:11px;">'+wrapSvgText(esc(centerLabel),cx,cy)+'</text>'
      + circles
    + '</svg></div></div>';
}

function renderKGSvg(levelNum){
  const concepts = CONCEPTS_BY_LEVEL[levelNum]||[];
  const n = concepts.length;
  if(!n) return '<div class="empty-state">'+t('emptySearch')+'</div>';
  const size = Math.max(460, n*46);
  const cx=size/2, cy=size/2, r=Math.min(size/2-70, 60+n*9);
  const pos = {};
  concepts.forEach(function(c,i){ const a=(Math.PI*2*i/n)-Math.PI/2; pos[c.id]={x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}; });
  const seen = {}; const edges=[];
  concepts.forEach(function(c){
    const rel = c[state.lang].related||[];
    rel.forEach(function(title){
      const target = concepts.find(function(x){return x[state.lang].title.toLowerCase()===String(title).toLowerCase();});
      if(target && target.id!==c.id){
        const key = [c.id,target.id].sort().join('|');
        if(!seen[key]){ seen[key]=true; edges.push([c.id,target.id]); }
      }
    });
  });
  const edgeSvg = edges.map(function(pair){ return '<line class="kg-edge" x1="'+pos[pair[0]].x+'" y1="'+pos[pair[0]].y+'" x2="'+pos[pair[1]].x+'" y2="'+pos[pair[1]].y+'"/>'; }).join('');
  const nodeSvg = concepts.map(function(c){
    const p = pos[c.id];
    return '<g data-action="kg-jump" data-id="'+c.id+'" style="cursor:pointer;"><circle class="kg-node-circle" cx="'+p.x+'" cy="'+p.y+'" r="30"/><text class="kg-node-label" x="'+p.x+'" y="'+p.y+'" text-anchor="middle" dominant-baseline="middle">'+wrapSvgText(esc(c[state.lang].title), p.x, p.y)+'</text></g>';
  }).join('');
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" style="display:block;">'+edgeSvg+nodeSvg+'</svg>';
}

function toggleBookmark(id){

  persist('daig_bookmarks', Array.from(state.bookmarks));
  showToast(added ? t('toastBookmarkAdded') : t('toastBookmarkRemoved'));

}
function toggleFavorite(id){
  const added = !state.favorites.has(id);
  if(added) state.favorites.add(id); else state.favorites.delete(id);
